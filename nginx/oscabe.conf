# OSCABE AI — Add this as a NEW file in /etc/nginx/sites-available/
# DO NOT modify any existing Nginx configs!
# Replace 3012 with the actual port from deployment

server {
    listen 80;
    server_name oscabe.com www.oscabe.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name oscabe.com www.oscabe.com;

    ssl_certificate /etc/letsencrypt/live/oscabe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oscabe.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://localhost:3012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
